name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app for Android
        run: npm run build -- --base=./

      - name: Generate Android project
        run: npx cap add android

      - name: Apply PC TECHNO TUNER branding
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/drawable
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            rsvg-convert -w "${size}" -h "${size}" public/pc-techno-icon.svg > "/tmp/icon-${density}.png"
            cp "/tmp/icon-${density}.png" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "/tmp/icon-${density}.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
            cp "/tmp/icon-${density}.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.png"
          done
          rsvg-convert -w 1200 -h 1200 public/pc-techno-splash.svg > android/app/src/main/res/drawable/splash.png
          if [ -d android/app/src/main/res/drawable-port ]; then
            cp android/app/src/main/res/drawable/splash.png android/app/src/main/res/drawable-port/splash.png
          fi

      - name: Sync app assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PC-TECHNO-TUNER-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
