<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#2563eb" stroke-width="4" stroke-opacity="0.3" />

  <!-- Circuit tech lines -->
  <path d="M 64 256 H 136 L 168 192 L 208 320 L 248 224 L 280 256 H 448" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
  <circle cx="136" cy="256" r="6" fill="#60a5fa" />
  <circle cx="280" cy="256" r="6" fill="#60a5fa" />
  <circle cx="448" cy="256" r="8" fill="#60a5fa" />

  <!-- Central Emblem -->
  <rect x="116" y="116" width="280" height="280" rx="48" fill="#0b1329" stroke="url(#blueGlow)" stroke-width="8" filter="url(#glow)" />

  <!-- Monogram PT and Hardware Motif -->
  <path d="M 168 180 H 260 C 295 180 320 200 320 235 C 320 270 295 290 260 290 H 218 V 340 H 168 V 180 Z M 218 222 V 248 H 254 C 268 248 276 242 276 235 C 276 228 268 222 254 222 Z" fill="#ffffff" />
  <path d="M 292 205 H 356 V 238 H 336 V 340 H 292 V 238 H 272 V 205 Z" fill="url(#blueGlow)" />

  <!-- Tuning dial indicator -->
  <circle cx="380" cy="140" r="16" fill="#22c55e" />
  <circle cx="380" cy="140" r="8" fill="#ffffff" />
</svg>
